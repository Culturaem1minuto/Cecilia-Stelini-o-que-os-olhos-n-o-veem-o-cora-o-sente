html{
  scroll-behavior:auto
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Newsreader",Georgia,serif
}

img{
  max-width:100%
}

.font-syne{
  font-family:"Syne",sans-serif
}

.font-grotesk{
  font-family:"Space Grotesk",sans-serif
}

.font-jakarta{
  font-family:"Plus Jakarta Sans",sans-serif
}

.font-news{
  font-family:"Newsreader",Georgia,serif
}

.font-bodoni{
  font-family:"Bodoni Moda",Georgia,serif
}

.big-photo{
  width:100%;
  height:auto;
  min-height:620px;
  -o-object-fit:contain;
     object-fit:contain;
  -o-object-position:center top;
     object-position:center top;
  background:var(--card);
  border-radius:10px;
  border:1px solid var(--line);
  display:block
}

.poster-photo{
  min-height:900px
}

.hero-photo{
  width:100%;
  height:100%;
  -o-object-fit:contain;
     object-fit:contain;
  -o-object-position:center;
     object-position:center;
  background:var(--card);
  display:block
}

.dropcap::first-letter{
  font-family:"Bodoni Moda",Georgia,serif;
  font-size:84px;
  line-height:.78;
  float:left;
  padding:10px 14px 0 0;
  color:var(--bordeaux);
  font-weight:700
}

@media(max-width:640px){
  .big-photo{
    min-height:420px
  }

  .poster-photo{
    min-height:620px
  }

  .dropcap::first-letter{
    font-size:68px
  }
}

@media (min-width: 640px) {
  .sm\:flex-row {
    flex-direction: row;
  }

  .sm\:items-center {
    align-items: center;
  }

  .sm\:p-8 {
    padding: 2rem;
  }

  .sm\:px-4 {
    padding-left: 1rem;
    padding-right: 1rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:pt-16 {
    padding-top: 4rem;
  }

  .sm\:text-\[10px\] {
    font-size: 10px;
  }

  .sm\:text-\[15px\] {
    font-size: 15px;
  }

  .sm\:text-\[36px\] {
    font-size: 36px;
  }

  .sm\:text-\[44px\] {
    font-size: 44px;
  }
}

@media (min-width: 768px) {
  .md\:flex {
    display: flex;
  }

  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

 gap-y-2 text-[11px] uppercase tracking-[0.14em] text-[var(--muted)]",children:[m("span",{children:"Por Cultura em 1 Minuto"}),m("span",{"aria-hidden":"true",children:"•"}),m("span",{children:"7 de novembro"}),m("span",{"aria-hidden":"true",children:"•"}),m("span",{children:"Galeria Metrópole"}),m("span",{className:"rounded-full bg-[var(--yellow)] px-2.5 py-1 font-bold text-black",children:"Ao vivo no dia"})]})]}),M("figure",{className:"mt-12 w-screen max-w-none",children:[m("div",{className:"h-[78vh] w-full overflow-x-clip border-y border-[var(--line)] bg-[var(--card)]",children:m("img",{src:Xp,alt:"Cecilia Stelini diante de fio bordô em instalação",className:"hero-photo"})}),m("figcaption",{className:"font-jakarta mx-auto max-w-[1440px] px-3 pt-3 text-[11px] uppercase tracking-[0.08em] text-[var(--muted)]",children:"O fio bordô como linha de vida — a matéria que costura cinco décadas de trabalho. Foto: Divulgação / Acervo Cecilia Stelini"})]}),M("article",{className:"mx-auto max-w-[760px] px-4 sm:px-6",children:[m("p",{className:"dropcap font-news mt-10 text-[20px] leading-[1.8] text-[var(--body)]",children:"Há obras que pedem para ser olhadas. Outras pedem para ser atravessadas. A de Cecilia Stelini pertence à segunda espécie. Quem entra em sua instalação não encontra apenas objetos dispostos no espaço: encontra um corpo em estado de escuta, uma linha que pulsa, um coração que insiste em sentir antes que a palavra chegue para explicar."}),m("p",{className:"font-news mt-6 text-[20px] leading-[1.8] text-[var(--body)]",children:"A trajetória atravessa cinco décadas. Começa em um Brasil em transformação, passa pela formação, pela experimentação radical do corpo e da matéria, e chega a este novembro com a maturidade de quem aprendeu que a arte não precisa gritar para ser ouvida. Basta um fio. Basta um coração. Basta o silêncio entre um ponto e outro."}),m("p",{className:"font-news mt-6 text-[20px] leading-[1.8] text-[var(--body)]",children:"Cecilia não coleciona fases: ela as sobrepõe, como camadas de pele, de papel, de cerâmica e de memória. Cada trabalho guarda o anterior. Cada exposição é uma dobra nova em um percurso contínuo, em que o íntimo e o coletivo, o delicado e o político, o efêmero e o permanente convivem sem pedir licença."})]}),m(Ve,{children:"1972 — O começo em Jovem Arte"}),M("article",{className:"mx-auto max-w-[760px] px-4 sm:px-6",children:[m("p",{className:"font-news mt-5 text-[20px] leading-[1.8] text-[var(--body)]",children:"Em 1972, Cecilia participa do VI Jovem Arte, marco inicial de uma trajetória que já nascia atenta ao experimental e ao espaço. Era um tempo em que o Brasil redescobria a arte como campo de liberdade — e a jovem artista entendia, cedo, que criar também era uma forma de pensar o país e o próprio corpo dentro dele."}),m("p",{className:"font-news mt-6 text-[20px] leading-[1.8] text-[var(--body)]",children:"A formação na FAAP, sob a influência de Walter Zanini, amplia esse horizonte. Zanini não era apenas um professor: era um pensador de museu, de vanguarda e de circulação. Sob sua mirada, Cecilia aprende a olhar a arte como sistema vivo — obra, espaço, público, história — e a entender que o gesto artístico pode ser, ao mesmo tempo, íntimo e institucional, silencioso e estrutural."})]}),m(ut,{src:Qp,alt:"Mar em silhueta, horizonte em tons escuros",caption:"O mar como horizonte e memória — distância, espera e retorno. Foto: Divulgação / Acervo Cecilia Stelini"}),m(Ve,{children:"1998 — O corpo entra em cena"}),M("article",{className:"mx-auto max-w-[760px] px-4 sm:px-6",children:[m("p",{className:"font-news mt-5 text-[20px] leading-[1.8] text-[var(--body)]",children:"Em 1998, a performance se torna território central. O corpo deixa de ser apenas tema e passa a ser matéria, instrumento e pergunta. Não é exibição: é presença. O gesto lento, a respiração, o tempo real da ação criam um espaço em que o espectador não assiste de fora — ele é chamado a permanecer."}),m("blockquote",{className:"font-syne my-10 border-l-4 border-[var(--bordeaux)] pl-5 text-[32px] font-bold leading-[1.15] text-[var(--bordeaux-light)]",children:"“O coração sente antes da palavra. A obra é o intervalo entre sentir e dizer.”"}),m("p",{className:"font-news mt-6 text-[20px] leading-[1.8] text-[var(--body)]",children:"Nesse momento, o diálogo com o pensamento de Nicolas Bourriaud ganha força. A arte relacional — a obra como encontro, como produção de laço, como experiência partilhada — encontra na prática de Cecilia uma tradução profundamente corporal. A relação não é conceito abstrato: é fio estendido entre pessoas, é olhar sustentado, é tempo doado."})]}),m(ut,{src:Gp,alt:"Performance de Cecilia Stelini em espaço expositivo",caption:"Performance, 1998 — o corpo como matéria, instrumento e pergunta. Foto: Divulgação / Acervo Cecilia Stelini"}),m(Ve,{children:"AT|AL|609 — Um código, um lugar, um estado"}),M("article",{className:"mx-auto max-w-[760px] px-4 sm:px-6",children:[m("p",{className:"font-news mt-5 text-[20px] leading-[1.8] text-[var(--body)]",children:"AT|AL|609 não é apenas um título. É um código de travessia: ateliê, altar, lugar — e um número que marca um endereço da memória. Ali, a artista condensa o que aprendeu em décadas: que o espaço de criação também pode ser espaço de cura, de escuta e de partilha."}),m("p",{className:"font-news mt-6 text-[20px] leading-[1.8] text-[var(--body)]",children:"O trabalho se organiza em polaridades. Dentro e fora. Cheio e vazio. Pele e cerâmica. Memória e presente. Coração e razão. Cecilia não resolve essas tensões: ela as sustenta. A polaridade, em sua obra, não é conflito a ser vencido, mas energia a ser atravessada — como quem segura as duas pontas de um fio sem deixá-lo arrebentar."})]}),m(ut,{src:wp,alt:"Obra com peixe e coração em fio bordô",caption:"Peixe + coração — o símbolo que atravessa a obra como um batimento. Foto: Divulgação / Acervo Cecilia Stelini"}),m(Ve,{children:"1989–2004 — Objetos, peles e o tempo das coisas"}),M("article",{className:"mx-auto max-w-[760px] px-4 sm:px-6",children:[m("p",{className:"font-news mt-5 text-[20px] leading-[1.8] text-[var(--body)]",children:"Entre 1989 e 2004, os objetos ganham densidade biográfica. São peças que carregam uso, desgaste, toque e história. Não são objetos neutros: são quase-corpos. Guardam o gesto de quem os fez, de quem os tocou, de quem os guardou por anos antes de entregá-los à obra."}),m("p",{className:"font-news mt-6 text-[20px] leading-[1.8] text-[var(--body)]",children:"É também o período em que a ideia de pele se amplia. A pele não é só superfície: é fronteira, é arquivo, é aquilo que nos separa e nos liga ao mundo. Quando Cecilia trabalha com papel, tecido, camadas e transparências, ela está falando de pele — da nossa, da dela, da pele das coisas."})]}),m(ut,{src:Pp,alt:"Papel da série Peles em camadas e transparências",caption:"Papel — série Peles. Camadas, transparência e a pele como arquivo. Foto: Divulgação / Acervo Cecilia Stelini"}),m(Ve,{children:"2004 — RETINA e a cerâmica como olhar"}),M("article",{className:"mx-auto max-w-[760px] px-4 sm:px-6",children:[m("p",{className:"font-news mt-5 text-[20px] leading-[1.8] text-[var(--body)]",children:"Em 2004, a cerâmica entra com força em RETINA. O barro, a queima, a permanência: tudo ali fala de um olhar que atravessa o tempo. Retina é o fundo do olho, o lugar onde a imagem se forma antes de virar lembrança. Ao modelar a cerâmica, Cecilia modela também um modo de ver — lento, tátil, atento."}),m("p",{className:"font-news mt-6 text-[20px] leading-[1.8] text-[var(--body)]",children:"A cerâmica não substitui o fio nem o papel: ela os ancora. Se o fio é o que flutua e liga, a cerâmica é o que pesa e fica. Entre leveza e gravidade, a obra encontra seu equilíbrio — e o espectador encontra um lugar para pousar o olhar."})]}),m(ut,{src:Bp,alt:"Segunda imagem do mar, luz baixa sobre a água",caption:"Mar 2 — o retorno do horizonte como lugar de escuta. Foto: Divulgação / Acervo Cecilia Stelini"}),m(Ve,{children:"O fio bordô — 20 fios, miçangas e uma instalação que respira"}),M("article",{className:"mx-auto max-w-[760px] px-4 sm:px-6",children:[m("p",{className:"font-news mt-5 text-[20px] leading-[1.8] text-[var(--body)]",children:"O fio bordô é a assinatura mais reconhecível de Cecilia — e também a mais difícil de resumir. Ele é linha, sangue, costura, destino, veia, caminho. Ele liga o que estava separado. Ele marca o que não pode ser apagado. Ele é, ao mesmo tempo, delicado e insistente."}),m("p",{className:"font-news mt-6 text-[20px] leading-[1.8] text-[var(--body)]",children:"Em uma de suas instalações mais emblemáticas, 20 fios descem pelo espaço carregados de miçangas. Cada fio é uma contagem, uma oração, uma biografia em miniatura. O conjunto não se impõe pelo tamanho, mas pela repetição: vinte vezes o mesmo gesto, vinte vezes o cuidado, vinte vezes a decisão de continuar."}),m("p",{className:"font-news mt-6 text-[20px] leading-[1.8] text-[var(--body)]",children:"Caminhar entre esses fios é caminhar dentro de um corpo ampliado. O ar muda. O som muda. O tempo muda. A instalação não pede pressa: pede que o visitante aprenda, de novo, a estar ali."})]}),m(Ve,{children:"100 Cabeças, Corações à venda e Série Branca"}),M("article",{className:"mx-auto max-w-[760px] px-4 sm:px-6",children:[m("p",{className:"font-news mt-5 text-[20px] leading-[1.8] text-[var(--body)]",children:"Em 100 Cabeças, a multiplicidade vira método. Cem formas, cem presenças, cem modos de estar no mundo. Nenhuma cabeça é igual à outra — e, juntas, elas formam uma comunidade. A obra lembra que a identidade não é singular: somos muitos dentro de um só corpo, muitas vozes dentro de uma só história."}),m("p",{className:"font-news mt-6 text-[20px] leading-[1.8] text-[var(--body)]",children:"Os Corações à venda tensionam, com delicadeza e ironia, a relação entre afeto e mercado. O que significa colocar um coração à venda? O que se compra quando se compra um símbolo? Cecilia não entrega resposta pronta: entrega um objeto que continua batendo na mão de quem o leva — e uma pergunta que continua batendo depois que a feira acaba."}),m("p",{className:"font-news mt-6 text-[20px] leading-[1.8] text-[var(--body)]",children:"A Série Branca, por sua vez, é silêncio. Depois do bordô intenso, o branco aparece como respiro, como página, como pele recém-nascida. Não é ausência de cor: é presença de luz. É a obra aprendendo a falar baixo — e, por isso mesmo, sendo ouvida mais longe."})]}),m(Ve,{children:"Três anos de livro, três atos de uma vida"}),M("article",{className:"mx-auto max-w-[760px] px-4 sm:px-6",children:[m("p",{className:"font-news mt-5 text-[20px] leading-[1.8] text-[var(--body)]",children:"O livro levou três anos para nascer. Três anos de seleção, de escuta, de reencontro com arquivos, de decisão sobre o que mostrar e o que guardar. Não é um catálogo frio: é uma obra em si, organizada em três atos — como uma peça, como uma vida, como um corpo que se abre em capítulos."}),m("p",{className:"font-news mt-6 text-[20px] leading-[1.8] text-[var(--body)]",children:"No primeiro ato, a formação e o começo. No segundo, o corpo, a performance e a matéria. No terceiro, a maturidade, o fio, o coração e a permanência. Entre um ato e outro, o leitor é convidado a respirar — a deixar que a imagem faça o trabalho que a palavra, sozinha, não faria."}),m("p",{className:"font-news mt-6 text-[20px] leading-[1.8] text-[var(--body)]",children:"É um livro para ser tocado, folheado devagar, guardado perto. Como a obra de Cecilia, ele não quer ser consumido: quer ser vivido."})]}),m("section",{className:"mx-auto mt-16 max-w-[1100px] px-3 sm:px-4",children:M("div",{className:"rounded-[10px] border border-[var(--bordeaux)] bg-[var(--bordeaux-bg)] p-5 sm:p-8",children:[M("div",{className:"flex flex-wrap items-center justify-between gap-3",children:[m("p",{className:"font-grotesk text-[12px] font-bold uppercase tracking-[0.25em] text-[var(--bordeaux-light)]",children:"Serviço
